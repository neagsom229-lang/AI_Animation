name: Render Remotion Video

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  render:
    name: Render Production Composition
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Cache Remotion Browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/remotion
          key: ${{ runner.os }}-remotion-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-remotion-

      - name: Render Determinism Test
        run: npx remotion render DeterminismTest out/determinism-test.mp4 --codec=h264

      - name: Render Scene 10s
        run: npx remotion render Scene10s out/scene10s.mp4 --codec=h264

      - name: Upload Video Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kuanimation-videos
          path: |
            out/determinism-test.mp4
            out/scene10s.mp4
