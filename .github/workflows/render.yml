name: CI

on:
  push:
  workflow_dispatch:
  tags:
    - 'v*'

jobs:
  verify:
    name: Typecheck + Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run Tests
        run: npm test

  render:
    name: Render Production Composition
    needs: verify
    # Render only on manual dispatch or version tags — never on plain pushes.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Cache Remotion Browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/remotion
          key: ${{ runner.os }}-remotion-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-remotion-

      - name: Render Determinism Test
        run: node scripts/render.mjs --composition DeterminismTest --out out/determinism-test.mp4

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kuanimation-videos
          path: out/determinism-test.mp4
          if-no-files-found: error
